# nginx — the single entry point for the HA stack.
#
# Three things enter here: OTLP/gRPC (4317), OTLP/HTTP (4318) and the SigNoz
# UI/API (8080). Port 8081 serves nginx's own health endpoint and is not
# published to the host.
#
# To terminate TLS here, add `ssl` to the listen directives and mount certs —
# see ../../security/README.md.

worker_processes  auto;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Telemetry bodies are large and compressed; do not buffer them to disk.
    client_max_body_size        32m;
    client_body_buffer_size     1m;
    proxy_request_buffering     off;

    # OTLP exporters hold connections open between batches.
    keepalive_timeout           75s;
    proxy_connect_timeout       5s;
    proxy_send_timeout          60s;
    proxy_read_timeout          60s;

    log_format  otlp  '$remote_addr - $status $body_bytes_sent '
                      'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time '
                      '"$request"';
    access_log  /var/log/nginx/access.log  otlp;
    error_log   /var/log/nginx/error.log   warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Upstreams ────────────────────────────────────────────────────────────
    # least_conn suits OTLP better than round-robin: exporters hold long-lived
    # connections, so balancing by request count would pin a heavy client to
    # one collector for its whole lifetime.
    upstream otel_grpc {
        least_conn;
        server otel-collector-1:4317 max_fails=3 fail_timeout=30s;
        server otel-collector-2:4317 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream otel_http {
        least_conn;
        server otel-collector-1:4318 max_fails=3 fail_timeout=30s;
        server otel-collector-2:4318 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream signoz_ui {
        # ip_hash keeps a browser session on one backend. The session itself
        # lives in Postgres, so this is a cache-locality preference, not a
        # correctness requirement — losing a backend is safe.
        ip_hash;
        server signoz-1:8080 max_fails=3 fail_timeout=30s;
        server signoz-2:8080 max_fails=3 fail_timeout=30s;
    }

    # ── OTLP gRPC ────────────────────────────────────────────────────────────
    server {
        listen 4317;
        http2  on;          # `listen ... http2` is deprecated since nginx 1.25.1

        location / {
            grpc_pass grpc://otel_grpc;
            grpc_read_timeout  60s;
            grpc_send_timeout  60s;
            # Retry the other collector when one refuses or dies mid-stream.
            grpc_next_upstream error timeout non_idempotent;
        }
    }

    # ── OTLP HTTP ────────────────────────────────────────────────────────────
    server {
        listen 4318;

        location / {
            proxy_pass         http://otel_http;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }

    # ── SigNoz UI / API ──────────────────────────────────────────────────────
    server {
        listen 8080;

        location / {
            proxy_pass         http://signoz_ui;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # The UI streams query results and uses websockets for live tail.
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_buffering    off;
            proxy_read_timeout 300s;
        }
    }

    # ── nginx's own health, for the container healthcheck ────────────────────
    server {
        listen 8081;
        access_log off;

        location /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
