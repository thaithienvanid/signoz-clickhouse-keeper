# Security overlay for the HA stack.
#
#   scripts/apply-security.sh ha tls bearer-auth
#   docker compose -f docker-compose.yaml -f compose.security.yaml up -d
#
# Both collectors get the same generated config, certificates and credentials;
# only their OpAMP endpoint stays per-replica.
#
# Note on where TLS belongs: in this topology nginx is the only thing clients
# reach, so terminating TLS at nginx and leaving the collectors plaintext on
# the internal network is the simpler and more common choice. Applying the tls
# fragment here instead gives you encryption all the way to the collector,
# which is what you want if the Docker network is not itself trusted. Doing
# both means nginx must re-originate TLS to the upstreams.
#
# Run scripts/apply-security.sh first — without config.generated.yaml the bind
# mount would create a directory and the collectors would fail to start.

services:
  # Fresh named volumes are root-owned; the collector runs as uid 10001 and
  # file_storage could not write its queue. Fix ownership once, as root.
  init-collector-queue:
    image: signoz/signoz-otel-collector:${SIGNOZ_OTEL_COLLECTOR_VERSION}
    container_name: signoz-ha-init-collector-queue
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /queue-1 /queue-2 &&
        chown -R 10001:10001 /queue-1 /queue-2
    volumes:
      - collector-queue-1:/queue-1
      - collector-queue-2:/queue-2
    restart: on-failure
    networks: [signoz-ha-net]

  otel-collector-1:
    depends_on:
      init-collector-queue: {condition: service_completed_successfully}
    volumes:
      - ./collector/config.generated.yaml:/etc/otel-collector-config.yaml:ro
      - ./collector/opamp-1.yaml:/etc/opamp-config.yaml:ro
      - ./certs:/etc/otel/certs:ro
      - ./secrets:/etc/otel/secrets:ro
      - collector-queue-1:/var/lib/otelcol/queue

  otel-collector-2:
    depends_on:
      init-collector-queue: {condition: service_completed_successfully}
    volumes:
      - ./collector/config.generated.yaml:/etc/otel-collector-config.yaml:ro
      - ./collector/opamp-2.yaml:/etc/opamp-config.yaml:ro
      - ./certs:/etc/otel/certs:ro
      - ./secrets:/etc/otel/secrets:ro
      - collector-queue-2:/var/lib/otelcol/queue

volumes:
  collector-queue-1:
  collector-queue-2:
