name: validate

on:
  push:
    branches: ["**"]
  pull_request:
  # Image tags get deleted and SigNoz's ClickHouse compatibility pin moves.
  # A weekly run catches that before someone's deploy does.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # Every step here is seconds of work. Without a bound, a hung image pull
    # holds a runner for the default six hours — which is exactly what happened
    # once to the nginx step below.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils shellcheck
          python3 -m pip install --quiet pyyaml

      # Lets validate.sh forge deploy/foundry/casting.yaml, so the migration
      # target in docs/foundry.md cannot rot unnoticed. Pinned to the version
      # the runbook was checked against.
      - name: Install foundryctl
        env:
          FOUNDRY_VERSION: v0.5.0
          # sha256 of foundry_linux_amd64.tar.gz, from the release's
          # foundry_0.5.0_checksums.txt. Pinned here rather than read from
          # that file at run time: the file comes from the same release, so
          # it would catch corruption but not a release that changes under the
          # same tag. Bump it together with FOUNDRY_VERSION.
          FOUNDRY_SHA256: b2f21e0cf12e9fa0f32dcaf414ec97823b32a29c3252bee23b896d158af2c650
        # GitHub's release download host returns transient 502/503s, which
        # once failed this whole job. Retry them, and download to a file
        # rather than piping into tar: curl writes a retried transfer after
        # the partial one, and tar would see the corrupt concatenation.
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 \
            -o "$RUNNER_TEMP/foundry.tar.gz" \
            "https://github.com/SigNoz/foundry/releases/download/${FOUNDRY_VERSION}/foundry_linux_amd64.tar.gz"
          echo "${FOUNDRY_SHA256}  $RUNNER_TEMP/foundry.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/foundry.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/foundry_linux_amd64/bin" >> "$GITHUB_PATH"

      - name: Static validation
        run: ./scripts/validate.sh

      - name: Check nginx config
        timeout-minutes: 5
        run: |
          # nginx resolves every `upstream` hostname at config-parse time, so
          # `nginx -t` in a bare container fails with "host not found in
          # upstream" even when the syntax is perfect. Stub the compose service
          # names in /etc/hosts so the parse gets as far as the actual syntax.
          docker run --rm \
            --add-host otel-collector-1:127.0.0.1 \
            --add-host otel-collector-2:127.0.0.1 \
            --add-host signoz-1:127.0.0.1 \
            --add-host signoz-2:127.0.0.1 \
            -v "$PWD/deploy/ha/loadbalancer/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.30-alpine nginx -t

  # Actually stands the standalone stack up and pushes telemetry through it.
  # Static validation cannot catch a wrong env var name or a config the
  # collector rejects at load time; this can. Once per sizing profile, so the
  # footprints in docs/standalone.md#sizing are re-measured on every run and
  # a profile whose limits stop holding fails here instead of on a laptop.
  e2e:
    name: e2e (${{ matrix.sizing }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sizing: [dev, default]
    steps:
      - uses: actions/checkout@v7

      - name: Configure the stack
        run: |
          cp deploy/standalone/.env.example deploy/standalone/.env
          sed -i "s/^CLICKHOUSE_PASSWORD=.*/CLICKHOUSE_PASSWORD=ci-$(openssl rand -hex 12)/" deploy/standalone/.env
          ./scripts/apply-sizing.sh standalone "${{ matrix.sizing }}"

      - name: Start
        working-directory: deploy/standalone
        run: docker compose up -d --wait --wait-timeout 900

      # Not optional. Without an organization the collector never leaves
      # no-op mode, so nothing is ingested and the smoke test cannot pass.
      - name: Bootstrap organization and admin
        env:
          SIGNOZ_ADMIN_PASSWORD: Ci-Bootstrap-1!
        run: ./scripts/bootstrap.sh standalone

      - name: Smoke test
        run: ./scripts/smoke-test.sh standalone

      # Three minutes of steady ingest with dashboard queries running, then
      # every row is accounted for. A memory_limiter refusal fails it.
      - name: Load test
        env:
          SIGNOZ_ADMIN_PASSWORD: Ci-Bootstrap-1!
        run: python3 scripts/load-test.py --duration 180 --rate 200 --query

      # Fails if anything was OOM-killed or restarted under that load. The
      # exit code is kept by hand: the default shell has no pipefail, so
      # `| tee` would hide it, and the summary is wanted either way.
      - name: Footprint
        run: |
          rc=0
          ./scripts/footprint.sh standalone --check > footprint.txt || rc=$?
          cat footprint.txt
          {
            echo "### Footprint: sizing profile \`${{ matrix.sizing }}\`"
            echo "After the smoke test and 180s at 200 spans, logs and metric points per second."
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' footprint.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Diagnostics on failure
        if: failure()
        working-directory: deploy/standalone
        run: |
          docker compose ps
          ../../scripts/footprint.sh standalone || true
          for svc in clickhouse-keeper clickhouse schema-migrator signoz otel-collector; do
            echo "::group::$svc"
            docker compose logs --tail=200 "$svc" || true
            echo "::endgroup::"
          done

      - name: Tear down
        if: always()
        working-directory: deploy/standalone
        run: docker compose down -v
